[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-session-toolkit"
version = "0.1.0"
description = "Session archiving, catalogue management, and reflection protocol tooling for Claude Code research sessions"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [
    {name = "Shawn Ross", email = "shawn@fedarch.org"},
]
keywords = [
    "claude-code",
    "session-archiving",
    "research-transparency",
    "FAIR",
    "metadata",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
api = ["anthropic>=0.40"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "PyYAML>=6.0",
]

[project.scripts]
cc-session = "cc_session_toolkit.cli:main"

[project.urls]
Homepage = "https://github.com/saross/cc-session-toolkit"
Repository = "https://github.com/saross/cc-session-toolkit"
Issues = "https://github.com/saross/cc-session-toolkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cc_session_toolkit = [
    "data/**/*.md",
    "data/**/*.yaml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
